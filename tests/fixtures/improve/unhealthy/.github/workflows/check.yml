name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Zero dependencies, so no install step. The roadmap is a VIEW of the
      # phases; a view that can go stale is how status came to be written in
      # two places that disagreed.
      - run: npm run check
