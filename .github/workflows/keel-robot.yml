# The robot (keel practice `climb`; managed: keel render rewrites it).
#
# An agent works the issues it is handed (keel phase 54): an issue labelled
# keel:agent that holds the rubric (scripts/keel/rubric.mjs: what is wrong
# and how to see it, how to tell it is mended, nothing only the owner can
# give, one change) is worked under .agents/climb/ROBOT.md, and the result is
# a PR on keel/robot-<issue> that a person merges. scripts/keel/robot.mjs
# makes every choice: which issue, what the week's budget allows, what is
# posted. The rules, as a tend pass's:
#
#   - Off unless .keel/keel.json has "robot": { "on": true, "budgetMinutes": N },
#     N the minutes a week the agent may run; with no secret, a notice and
#     green. Past the week's budget the run waits, green, and says so.
#   - It starts on GitHub's own events: the keel:agent label put on an issue,
#     an issue carrying it reopened, a comment on one from someone with write
#     access (OWNER, MEMBER, COLLABORATOR; never a bot), and weekly for
#     anything missed. Any other event runs nothing. One issue at a time per
#     project: one concurrency group, never cancelled; a run that will not
#     work has a group of its own, so it never displaces a queued one. The
#     event only wakes the robot: robot.mjs pick chooses the issue (the
#     oldest never worked, or with a writer's comment since its last run).
#   - An issue that misses part of the rubric gets one comment naming what is
#     missing (once per body), and is not worked.
#   - Three jobs, as the climb's and the tend's, so the agent never holds a
#     credential that can write (ledger#92). `agent` runs it with a token that
#     can only read; its commits leave as a git bundle. `judge` (read-only,
#     no agent) installs on a fresh checkout of the run's commit, takes the
#     commits only after climb.mjs sandbox, then guards them from the run's
#     commit (climb.mjs guard --job robot: the sandbox, the record rules, the
#     gate). `publish` holds the write token, runs no code of the branch's,
#     checks the sandbox again, pushes refs/heads/keel/robot-<issue> (never
#     main), opens the PR with "Closes #<issue>", never merges, and posts the
#     agent's last message on the issue. A comment there starts the next run.
#
#   - "agent": "codex" on "robot": Codex in workspace-write with sudo dropped,
#     committing to .keel/agent-git, handed on as objects only, as
#     keel-tend.yml's.
#
# SECRET: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) or ANTHROPIC_API_KEY,
# as the climb's; OPENAI_API_KEY for a Codex robot, billed per token to the
# OpenAI API account. Each run spends model tokens, within "robot".budgetMinutes a week.
name: keel-robot

on:
  issues:
    types: [labeled, reopened]
  issue_comment:
    types: [created]
  schedule:
    # 10:19 UTC on Mondays, a minute after the tend pass's: anything missed.
    - cron: "19 10 * * 1"
  workflow_dispatch: {}

# One issue at a time per project, queued, never cancelled. GitHub keeps one
# pending run per group, so a run that will not work (any other comment: a
# bot's, a stranger's, one on an issue without the label) gets a group of its
# own, keyed by its run id; otherwise it would replace a queued run, then
# skip. The condition is the agent job's `if:`, word for word. A queued run
# that is replaced loses nothing: pick reads the issues, not the event.
concurrency:
  group: keel-robot-${{ ((github.event_name == 'issues' && ((github.event.action == 'labeled' && github.event.label.name == 'keel:agent') || (github.event.action == 'reopened' && contains(github.event.issue.labels.*.name, 'keel:agent')))) || (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'keel:agent') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && github.event.comment.user.type != 'Bot' && !endsWith(github.event.comment.user.login, '[bot]')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'queue' || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

# Each job asks for its own; nothing is granted by default.
permissions: {}

jobs:
  # The agent's job: its token reads and nothing more. No id-token: the
  # action is handed this token (github_token), so it never exchanges OIDC
  # for the Claude app's token, which could write.
  agent:
    # The trigger, before a runner starts: the label, a reopen of a labelled
    # issue, a writer's comment on one (never a bot's, never on a PR), the
    # schedule, or a person's dispatch from the default branch only: the
    # run's commit is the base every check trusts, and the PR goes to the
    # default branch, so a base on another branch would carry its commits in
    # unchecked (PR #59).
    if: |
      (github.event_name == 'issues' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'keel:agent') ||
          (github.event.action == 'reopened' && contains(github.event.issue.labels.*.name, 'keel:agent')))) ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        contains(github.event.issue.labels.*.name, 'keel:agent') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.comment.user.type != 'Bot' &&
        !endsWith(github.event.comment.user.login, '[bot]')) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # The agent's own step is bounded by this run's minutes (5 to 180); this
    # bounds the whole job, the reads included.
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: read
    outputs:
      action: ${{ steps.pick.outputs.action }}
      issue: ${{ steps.pick.outputs.issue }}
      branch: ${{ steps.pick.outputs.branch }}
      title: ${{ steps.pick.outputs.title }}
      triage: ${{ steps.pick.outputs.triage }}
      read: ${{ steps.pick.outputs.read }}
      seen: ${{ steps.pick.outputs.seen }}
      agent: ${{ steps.on.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Is the robot on?
        id: on
        run: |
          node -e '
            const fs = require("fs");
            let c = {};
            try { c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8")); } catch {}
            const r = c.robot;
            const on = Boolean(r && typeof r === "object" && r.on === true);
            if (!on) console.log("the robot is off: .keel/keel.json has no \"robot\": { \"on\": true, \"budgetMinutes\": N }, so this run does nothing.");
            // Which provider runs it (phase 45): read here for the secret gate; the pick validates it.
            const named = r && typeof r === "object" ? r.agent : undefined;
            const agent = named === undefined ? "claude" : /^[a-z]+$/.test(String(named)) ? String(named) : "invalid";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `on=${on}\nagent=${agent}\n`);
          '
      - name: Configured?
        id: configured
        if: steps.on.outputs.on == 'true'
        env:
          AGENT: ${{ steps.on.outputs.agent }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$AGENT" = codex ] && [ -z "$OPENAI" ]; then
            echo "::notice::Skipped: add the OPENAI_API_KEY secret for a robot run by Codex."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$AGENT" != codex ] && [ -z "$OAUTH" ] && [ -z "$API_KEY" ]; then
            echo "::notice::Skipped: add the CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) secret for the robot to run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The project's install, as the night's: `setup` when it has one, else
      # npm ci when a lockfile exists; `env` goes to every later step.
      - name: Read the config
        id: config
        if: steps.configured.outputs.enabled == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".keel/keel.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".keel/keel.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".keel/keel.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `KEEL_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.keel/keel.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
          '
      - name: Install
        if: steps.configured.outputs.enabled == 'true'
        # setupToken (a secret's name in .keel/keel.json) becomes GH_TOKEN here
        # and in no other step. Absent or unset, the job's own token. Never echoed.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || github.token }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.keel/keel.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      # The robot config, validated (a bad one is red, naming the key), and
      # this run's action: work one issue, answer the ones that miss the
      # rubric, wait on the week's budget (a notice, green), or nothing. Read
      # with this job's token, before the agent: the issue, the writers'
      # comments since its last run, and its open PR's diff go in the run's
      # record (.keel/robot/run.json) for the brief.
      - name: Pick an issue
        id: pick
        if: steps.configured.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/keel/robot.mjs pick --repo "$REPO" --record --json > "$RUNNER_TEMP/pick.json"
          node -e '
            const fs = require("fs");
            const [pick, out] = process.argv.slice(1);
            const p = JSON.parse(fs.readFileSync(pick, "utf8"));
            const eof = `KEEL_EOF_${Date.now()}`;
            const lines = [`action=${p.action}`, `issue=${p.issue ?? ""}`, `branch=${p.branch ?? ""}`, `minutes=${p.minutes ?? ""}`, `read=${p.read ?? ""}`, `seen=${(p.seen ?? []).join(",")}`, `triage=${(p.triage ?? []).join(" ")}`, `title<<${eof}`, p.title ?? "", eof];
            fs.appendFileSync(out, `${lines.join("\n")}\n`);
            console.log(p.action === "wait" ? `::notice::${p.reason}` : `${p.action}: ${p.reason}`);
          ' "$RUNNER_TEMP/pick.json" "$GITHUB_OUTPUT"

      # The issue's own branch, from the run's commit, before the agent changes anything.
      - name: Branch
        if: steps.pick.outputs.action == 'work'
        env:
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          git config user.name "keel-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH"

      # Codex's sandbox keeps .git read-only (phase 47): its commits go to a
      # git dir at .keel/agent-git, made here before it runs, holding the
      # branch as the steps above left it (fetched, so it shares no file with
      # .git's objects), and ignored by both, so no add ever carries it.
      - name: Give Codex its git dir
        if: steps.pick.outputs.action == 'work' && steps.on.outputs.agent == 'codex'
        env:
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          rm -rf .keel/agent-git
          git init -q --bare .keel/agent-git
          # Codex's TMPDIR, which its sandbox may write: pinned under /tmp,
          # never the runner's temp (GITHUB_ENV and GITHUB_OUTPUT live there).
          mkdir -p /tmp/keel-codex
          git --git-dir=.keel/agent-git fetch -q --no-tags "$PWD/.git" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          git --git-dir=.keel/agent-git symbolic-ref HEAD "refs/heads/$BRANCH"
          git --git-dir=.keel/agent-git config user.name "keel-robot"
          git --git-dir=.keel/agent-git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git --git-dir=.keel/agent-git --work-tree=. reset -q
          mkdir -p .keel/agent-git/info .git/info
          echo "/.keel/agent-git/" >> .keel/agent-git/info/exclude
          echo "/.keel/agent-git/" >> .git/info/exclude
          echo "Codex's git dir: .keel/agent-git, on $(git --git-dir=.keel/agent-git symbolic-ref --short HEAD) at $(git --git-dir=.keel/agent-git rev-parse --short HEAD)"

      # The brief: ROBOT.md, the issue, the writers' comments since its last
      # run, and its open PR's diff, as one prompt (robot.mjs brief).
      - name: Brief
        id: brief
        if: steps.pick.outputs.action == 'work'
        env:
          AGENT: ${{ steps.on.outputs.agent }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          # keel's scripts as the run's commit has them, kept outside the workspace
          # before the agent runs (PR #59): the steps after it run these, never a
          # file the agent edited and did not commit.
          mkdir -p "$RUNNER_TEMP/keel" && git archive "$GITHUB_SHA" scripts/keel .keel/keel.json | tar -x -C "$RUNNER_TEMP/keel"
          node scripts/keel/robot.mjs brief --out "$RUNNER_TEMP/prompt.md"
          if [ "$AGENT" = codex ]; then
            {
              echo
              echo "## Your git dir (Codex)"
              echo
              echo "Your sandbox keeps \`.git\` read-only, so your git dir is \`.keel/agent-git\`, a clone the workflow made of \`$BRANCH\`. Run every git command as \`git --git-dir=.keel/agent-git --work-tree=. <command>\`, and every climb.mjs command as \`KEEL_AGENT_GIT=.keel/agent-git node scripts/keel/climb.mjs …\`, so its commits use it too. Commit on \`$BRANCH\`: only that branch's commits leave this job, as objects (the git dir's config and hooks never do). Never change the git dir's config, hooks or \`info/\`, and never touch \`.git\`."
            } >> "$RUNNER_TEMP/prompt.md"
          fi
          eof="KEEL_EOF_$(date +%s%N)"
          {
            echo "prompt<<$eof"
            cat "$RUNNER_TEMP/prompt.md"
            echo "$eof"
            echo "started=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      # The agent, time-boxed to this run's minutes. Its tools cannot push,
      # merge or reach gh, and the token it is given reads. A timeout is not
      # red: what it committed before the box closed is judged.
      - name: Work the issue
        id: work
        if: steps.pick.outputs.action == 'work' && steps.on.outputs.agent == 'claude'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.pick.outputs.minutes) }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.brief.outputs.prompt }}
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node scripts/roadmap.mjs*),Bash(npm test*),Bash(npm run *),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git add *),Bash(git commit *)"
      - name: Work the issue
        id: work_codex
        if: steps.pick.outputs.action == 'work' && steps.on.outputs.agent == 'codex'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.pick.outputs.minutes) }}
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ""
          KEEL_AGENT_GIT: .keel/agent-git
          # Its sandbox writes $TMPDIR: pinned away from the runner's temp, whose
          # command files (GITHUB_ENV, GITHUB_OUTPUT) would reach every later step.
          TMPDIR: /tmp/keel-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/prompt.md
          output-file: ${{ runner.temp }}/codex-final-message.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      # An agent that failed before its time box ran out is red, and nothing
      # is judged, pushed or posted (lesson 29); a timeout is not red.
      - name: Did the agent run?
        if: steps.pick.outputs.action == 'work'
        env:
          AGENT: ${{ steps.on.outputs.agent }}
          OUTCOME: ${{ steps.on.outputs.agent == 'codex' && steps.work_codex.outcome || steps.work.outcome }}
          EXECUTION: ${{ steps.work.outputs.execution_file }}
          MINUTES: ${{ steps.pick.outputs.minutes }}
          STARTED: ${{ steps.brief.outputs.started }}
        run: |
          if [ "$AGENT" = codex ]; then
            node "$RUNNER_TEMP/keel/scripts/keel/climb.mjs" agent-ran --agent codex --outcome "$OUTCOME" --file "$RUNNER_TEMP/codex-final-message.md" --minutes "$MINUTES" --started "$STARTED"
          else
            node "$RUNNER_TEMP/keel/scripts/keel/climb.mjs" agent-ran --outcome "$OUTCOME" --file "${EXECUTION:-$RUNNER_TEMP/claude-execution-output.json}" --minutes "$MINUTES" --started "$STARTED"
          fi

      # Never trust the git dir Codex could write (phase 47): its config,
      # hooks, attributes and aliases are the agent's, so no git command here
      # reads it. Only objects leave it: its loose objects and packs (regular
      # files; no symlink, no alternates), copied into a repo keel makes here
      # (its objects' base from .git, which Codex could not write), and the
      # one ref, read as a file. git runs with no system or global config,
      # hooks and fsmonitor off. A head not on top of the run's commit is
      # refused, as the judge would; the run's commits leave as a bundle from keel's repo.
      - name: Take Codex's commits, objects only
        if: always() && steps.pick.outputs.action == 'work' && steps.on.outputs.agent == 'codex'
        env:
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          src=.keel/agent-git
          dst="$RUNNER_TEMP/agent-objects"
          out="$RUNNER_TEMP/handoff"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          g() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false --git-dir="$dst" "$@"; }
          rm -rf "$dst"
          mkdir -p "$out"
          git init -q --bare "$dst"
          echo "$PWD/.git/objects" > "$dst/objects/info/alternates"
          if [ -d "$src/objects" ] && [ ! -L "$src" ] && [ ! -L "$src/objects" ]; then
            (cd "$src/objects" && find . -type f -print0) | while IFS= read -r -d '' f; do
              case "$f" in
                */*/*/*) continue ;;
                ./[0-9a-f][0-9a-f]/[0-9a-f]*|./pack/pack-*.pack|./pack/pack-*.idx) ;;
                *) continue ;;
              esac
              d=$(dirname "$f")
              if [ -L "$src/objects/$d" ] || [ -L "$src/objects/$f" ] || [ ! -f "$src/objects/$f" ]; then continue; fi
              mkdir -p "$dst/objects/$d"
              cp "$src/objects/$f" "$dst/objects/$f"
            done
          fi
          ref="refs/heads/$BRANCH"
          tip=""
          if [ -f "$src/$ref" ] && [ ! -L "$src/$ref" ]; then
            tip=$(sed -n 1p "$src/$ref")
          elif [ -f "$src/packed-refs" ] && [ ! -L "$src/packed-refs" ]; then
            tip=$(awk -v r="$ref" '$2 == r { print $1; exit }' "$src/packed-refs")
          fi
          if [ -z "$tip" ]; then
            echo "::warning::Codex's git dir has no $ref: nothing of Codex's is handed on."
            exit 0
          fi
          case "$tip" in *[!0-9a-f]*) echo "::error::Codex's $ref is not an object name; nothing is handed on."; exit 1 ;; esac
          if [ "${#tip}" != 40 ] && [ "${#tip}" != 64 ]; then
            echo "::error::Codex's $ref is not an object name; nothing is handed on."
            exit 1
          fi
          if ! g cat-file -e "$tip^{commit}" 2> /dev/null; then
            echo "::error::Codex's $ref names no commit its objects hold; nothing is handed on."
            exit 1
          fi
          if ! g merge-base --is-ancestor "$GITHUB_SHA" "$tip"; then
            echo "::error::Codex's $ref ($tip) is not on top of the run's commit ($GITHUB_SHA); nothing is handed on."
            exit 1
          fi
          g update-ref "$ref" "$tip"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            g bundle create "$out/run.bundle" "$GITHUB_SHA..$ref"
          fi
          echo "Codex's commits: $(g rev-list --count "$GITHUB_SHA..$tip") on $BRANCH, taken as objects"

      # The run's commits leave this job as a git bundle (the run's commit to
      # the branch's head), with the agent's last message (robot.mjs message:
      # Claude's execution file, Codex's final message; never printed); never
      # its working tree.
      - name: Hand the run on
        if: always() && steps.pick.outputs.action == 'work'
        env:
          BRANCH: ${{ steps.pick.outputs.branch }}
          AGENT: ${{ steps.on.outputs.agent }}
          EXECUTION: ${{ steps.work.outputs.execution_file }}
        run: |
          out="$RUNNER_TEMP/handoff"
          mkdir -p "$out"
          # Codex's commits are in its git dir, handed on above as objects; .git holds Claude's.
          if [ "$AGENT" != codex ] && git rev-parse -q --verify "refs/heads/$BRANCH" > /dev/null && [ "$(git rev-parse "refs/heads/$BRANCH")" != "$GITHUB_SHA" ]; then
            git bundle create "$out/run.bundle" "$GITHUB_SHA..refs/heads/$BRANCH"
          fi
          if [ "$AGENT" = codex ]; then
            node "$RUNNER_TEMP/keel/scripts/keel/robot.mjs" message --agent codex --file "$RUNNER_TEMP/codex-final-message.md" --out "$out/message.md"
          else
            node "$RUNNER_TEMP/keel/scripts/keel/robot.mjs" message --agent claude --file "${EXECUTION:-$RUNNER_TEMP/claude-execution-output.json}" --out "$out/message.md"
          fi
      - name: Keep the agent's commits
        if: always() && steps.pick.outputs.action == 'work'
        uses: actions/upload-artifact@v7
        with:
          name: keel-robot-agent
          path: ${{ runner.temp }}/handoff/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The judge: no agent, and a token that reads. A fresh checkout of the
  # run's commit installs first (the setup token's only step), then takes the
  # agent's commits only after climb.mjs sandbox (this checkout's copy, the
  # default branch's) says they change no workflow, no scripts/keel/, no
  # .keel/keel.json and no install file, so every script below, the config
  # and what was installed are the default branch's. The gate runs the
  # agent's code, with no setup token, which is why this job cannot write.
  judge:
    needs: agent
    if: needs.agent.outputs.action == 'work'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      commits: ${{ steps.judge.outputs.commits }}
      line: ${{ steps.judge.outputs.line }}
      judged: ${{ steps.judged.outputs.judged }}
      validated: ${{ steps.take.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read the config
        id: config
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".keel/keel.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".keel/keel.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".keel/keel.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `KEEL_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.keel/keel.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
          '
      - name: Install
        # As the agent job's: setupToken becomes GH_TOKEN here and in no other
        # step. It runs on the run's own commit, before the agent's commits are
        # taken: no code of theirs (a preinstall script, a changed lockfile)
        # ever runs where the setup token is, and the sandbox below refuses
        # an install file changed, so what is installed is what they run on.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || github.token }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.keel/keel.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      - uses: actions/download-artifact@v8
        with:
          name: keel-robot-agent
          path: ${{ runner.temp }}/handoff
      # The commit to judge, named here before any code of the agent's runs
      # (PR #59): the report, the hand-on and publish take this commit, never a
      # later HEAD the gate (the agent's code) could have moved to. Its bundle
      # is made here too: the gate can write the git dir (a hook, a config), so
      # after it no git runs here but keel's own, hooks and fsmonitor off.
      - name: Take the run's commits
        id: take
        env:
          BRANCH: ${{ needs.agent.outputs.branch }}
        run: |
          in="$RUNNER_TEMP/handoff"
          head="$GITHUB_SHA"
          if [ -f "$in/run.bundle" ]; then
            git fetch -q "$in/run.bundle" "refs/heads/$BRANCH"
            head=$(git rev-parse FETCH_HEAD)
          fi
          node scripts/keel/climb.mjs sandbox --base "$GITHUB_SHA" --head "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          git switch -q -c "$BRANCH" "$head"
          mkdir -p "$RUNNER_TEMP/judged"
          if [ "$head" != "$GITHUB_SHA" ]; then
            git bundle create "$RUNNER_TEMP/judged/run.bundle" "$GITHUB_SHA..refs/heads/$BRANCH"
          fi

      # Judged by the script, not the agent: anything uncommitted goes; the
      # robot's guard (the sandbox, the record rules, the gate: red if any
      # fails), from the run's commit, never a record's; then the PR body and
      # the run's line (robot.mjs report: git alone).
      - name: Judge the run
        id: judge
        env:
          ISSUE: ${{ needs.agent.outputs.issue }}
          TITLE: ${{ needs.agent.outputs.title }}
          AGENT: ${{ needs.agent.outputs.agent }}
          VALIDATED: ${{ steps.take.outputs.head }}
        run: |
          git reset -q --hard HEAD
          git clean -q -fd
          node scripts/keel/climb.mjs guard --job robot --base "$GITHUB_SHA"
          node scripts/keel/robot.mjs report --base "$GITHUB_SHA" --head "$VALIDATED" --issue "$ISSUE" --title "$TITLE" --agent "$AGENT" --body "$RUNNER_TEMP/body.md" --json > "$RUNNER_TEMP/report.json"
          node -e '
            const fs = require("fs");
            const [file, out, summary] = process.argv.slice(1);
            const r = JSON.parse(fs.readFileSync(file, "utf8"));
            fs.appendFileSync(out, `commits=${r.commits}\nline=${r.line}\n`);
            fs.appendFileSync(summary, `${r.line}\n`);
            console.log(r.line);
          ' "$RUNNER_TEMP/report.json" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false status --porcelain --untracked-files=no)" ]; then
            echo "::error::The tree changed after the guard; nothing is handed on."
            exit 1
          fi

      # Whether the judge itself ran (PR #59): "Judge the run"'s own outcome,
      # success (passed) or failure (refused); skipped when a step before it
      # failed (checkout, install, the take). The job's result cannot tell
      # these apart, so publish posts the run's mark only on these two.
      - name: Did the judge run?
        id: judged
        if: always()
        env:
          OUTCOME: ${{ steps.judge.outcome }}
        run: echo "judged=$OUTCOME" >> "$GITHUB_OUTPUT"

      # The judged run goes on as the agent's did: a bundle, the PR body, and
      # the agent's last message, whatever the verdict.
      - name: Hand the judged run on
        if: always()
        run: |
          out="$RUNNER_TEMP/judged"
          mkdir -p "$out"
          # The judged commit's bundle was made by the take step, before the gate; no git runs here (PR #59).
          if [ -f "$RUNNER_TEMP/body.md" ]; then cp "$RUNNER_TEMP/body.md" "$out/"; fi
          if [ -f "$RUNNER_TEMP/handoff/message.md" ]; then cp "$RUNNER_TEMP/handoff/message.md" "$out/"; fi
      - name: Keep the judged run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keel-robot-judged
          path: ${{ runner.temp }}/judged/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The only job that can write: no agent, and nothing of the branch's runs
  # here. It answers the issues that miss the rubric (read again here), checks
  # the sandbox again (git only), pushes the judged commits to the issue's own
  # branch, opens one PR, and posts the agent's last message on the issue.
  publish:
    needs: [agent, judge]
    if: always() && (needs.agent.outputs.action == 'work' || needs.agent.outputs.action == 'triage' || needs.agent.outputs.triage != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - if: needs.judge.result == 'success' || needs.judge.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: keel-robot-judged
          path: ${{ runner.temp }}/run

      # One comment per issue body that misses the rubric, naming what is
      # missing; robot.mjs reads each issue again with this job's token.
      - name: Answer the issues that miss the rubric
        if: needs.agent.outputs.triage != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIAGE: ${{ needs.agent.outputs.triage }}
        run: node scripts/keel/robot.mjs triage --repo "$REPO" --issues "$TRIAGE" --post

      # One PR, on the issue's own branch; a person merges it. A run with no
      # commit pushes nothing.
      - name: Open the robot's pull request
        id: pr
        if: needs.judge.result == 'success'
        env:
          COMMITS: ${{ needs.judge.outputs.commits }}
          LINE: ${{ needs.judge.outputs.line }}
          ISSUE: ${{ needs.agent.outputs.issue }}
          BRANCH: ${{ needs.agent.outputs.branch }}
          TITLE: ${{ needs.agent.outputs.title }}
          BASE: ${{ github.event.repository.default_branch || github.ref_name }}
          VALIDATED: ${{ needs.judge.outputs.validated }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::The issue number ($ISSUE) is not a number; nothing is pushed."; exit 1 ;; esac
          if [ "$BRANCH" != "keel/robot-$ISSUE" ]; then
            echo "::error::The branch ($BRANCH) is not keel/robot-$ISSUE; nothing is pushed."
            exit 1
          fi
          if [ "$COMMITS" = 0 ] || [ -z "$COMMITS" ]; then
            echo "::notice::No PR: $LINE"
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/run/run.bundle" ]; then
            echo "::error::The judge counted $COMMITS commits, but handed none on; nothing is pushed."
            exit 1
          fi
          # The judged commits, fetched as objects: the working tree stays
          # this run's commit, and the sandbox is this checkout's script.
          git fetch -q "$RUNNER_TEMP/run/run.bundle" "refs/heads/$BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          # Exactly the commit the judge took (PR #59), and the record rules held here, git alone: the
          # judge ran the agent's code (the gate), so nothing it hands on is trusted for them.
          if [ "$head" != "$VALIDATED" ]; then
            echo "::error::The bundle's head ($head) is not the commit the judge took ($VALIDATED); nothing is pushed."
            exit 1
          fi
          node scripts/keel/climb.mjs sandbox --base "$GITHUB_SHA" --head "$head" --records
          # The next run on the branch replaces its own commits (its brief
          # carried their diff), so it may force, but only over what the robot
          # pushed (PR #59): the branch is absent, or its tip is the commit the
          # robot's last run mark on the issue names. Anything else there is
          # someone's work and is never replaced; the lease holds that to the push.
          mine=$(node scripts/keel/robot.mjs pushed --repo "$REPO" --issue "$ISSUE")
          tip=$(git ls-remote origin "refs/heads/keel/robot-$ISSUE" | cut -f1)
          if [ -n "$tip" ] && [ "$tip" != "$mine" ]; then
            echo "::error::keel/robot-$ISSUE is at $tip, which the robot did not push (its last run pushed ${mine:-nothing}): someone else's work is there, so nothing is pushed. Delete the branch, or move that work elsewhere, for the robot to work #$ISSUE."
            exit 1
          fi
          git push --force-with-lease="refs/heads/keel/robot-$ISSUE:$tip" origin "$head:refs/heads/keel/robot-$ISSUE"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          num=$(gh pr list --state open --head "$BRANCH" --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -z "$num" ]; then
            code=0
            out=$(gh pr create --base "$BASE" --head "$BRANCH" --title "keel robot: $TITLE" --body-file "$RUNNER_TEMP/run/body.md" 2>&1) || code=$?
            echo "$out"
            if [ "$code" != 0 ]; then
              if printf '%s' "$out" | grep -qi 'not permitted to create or approve pull requests'; then
                echo "::notice::$BRANCH is pushed, but no PR was opened: allow it in Settings → Actions → General → Workflow permissions → \"Allow GitHub Actions to create and approve pull requests\"."
              else
                exit "$code"
              fi
            fi
          else
            # A PR reused is based on the branch that was judged (PR #59): retargeted since, or the default
            # branch changed, it would carry commits from outside $GITHUB_SHA..head.
            gh pr edit "$num" --base "$BASE" --body-file "$RUNNER_TEMP/run/body.md"
            based=$(gh pr view "$num" --json baseRefName --jq .baseRefName)
            if [ "$based" != "$BASE" ]; then
              echo "::error::PR #$num is based on $based, not $BASE, the branch that was judged; the issue is not marked worked."
              exit 1
            fi
          fi
          url=$(gh pr list --state open --head "$BRANCH" --json url,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].url // empty' || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # No PR is not published (PR #59): the issue is not marked worked, and a run after the setting
          # changes (or the owner's comment) opens it.
          if [ -z "$url" ]; then
            echo "::error::$BRANCH is pushed, but no pull request is open for it: the issue is not marked worked, so a later run tries again."
            exit 1
          fi

      # The issue is the conversation: the agent's last message, as it wrote
      # it, then the PR (or why there is none). Only when the judge's own step
      # ran (PR #59): an agent that never started is red above, and a judge
      # job that failed before judging posts nothing, so the issue is not
      # marked worked and the next run tries it again. A judged branch is
      # posted only once publishing succeeded (the push, the PR, or nothing to
      # publish, said so): a failed push or PR leaves the issue to be tried
      # again, never marked worked with nothing to show (PR #59).
      - name: Post the agent's last message
        if: always() && needs.agent.outputs.action == 'work' && ((needs.judge.outputs.judged == 'success' && steps.pr.outcome == 'success') || needs.judge.outputs.judged == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.agent.outputs.issue }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PUSHED: ${{ steps.pr.outputs.head }}
          JUDGE: ${{ needs.judge.outputs.judged }}
          READ: ${{ needs.agent.outputs.read }}
          SEEN: ${{ needs.agent.outputs.seen }}
          LINE: ${{ needs.judge.outputs.line }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/keel/robot.mjs post --repo "$REPO" --issue "$ISSUE" --message "$RUNNER_TEMP/run/message.md" --pr "$PR_URL" --judge "$JUDGE" --line "$LINE" --run "$RUN_URL" --read "$READ" --seen "$SEEN" --head "$PUSHED"
