name: check

on:
  # main only: every other branch is checked through its pull request, and a
  # push to it as well would run the same gate twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Zero dependencies, so no install step. The roadmap is a VIEW of the
      # phases; a view that can go stale is how status came to be written in
      # two places that disagreed.
      # When night supplies the ledger, record the configured outer gate.
      # CI-only adopters still run their check without that optional module.
      - name: Run the configured gate
        run: |
          if [ -f scripts/keel/test-ledger.mjs ]; then
            node scripts/keel/test-ledger.mjs --gate
          else
            {{check}}
          fi
      # The test ledger's record of this run (scripts/keel/test-ledger.mjs, the
      # night practice), kept as an artifact even when the check failed: the
      # night reads the newest ones on the default branch to say which test is
      # flaky or slower. A project without the reporter has nothing to keep.
      - name: Keep the test ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keel-test-runs
          path: .keel/test-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Reconcile records (optional)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if node -e 'const c=JSON.parse(require("fs").readFileSync(".keel/keel.json","utf8"));process.exit(c.practices.includes("reconciliation")?0:1)'; then
            node scripts/keel/reconcile.mjs --json
            # The PR's keel-impact declaration is keel-impact.yml's, so an
            # changed description is re-checked without re-running this gate.
            if [ "$EVENT" = push ] && [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
              node scripts/keel/reconcile.mjs --github --json
            fi
          fi
