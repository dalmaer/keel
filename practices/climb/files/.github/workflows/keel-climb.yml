# A climb night (keel practice `climb`; managed: keel render rewrites it).
#
# An agent climbs one number (the test suite's wall time, first) under the
# shared protocol in .agents/climb/PROTOCOL.md, and a person merges what it
# finds. scripts/keel/climb.mjs makes every measurement and every
# keep-or-revert, so the numbers are the script's, never the agent's. The
# rules, as the night's (keel docs/design.md §6):
#
#   - Off unless .keel/keel.json has "climb"; with no secret, a notice and green.
#   - One job a night: climb.mjs pick chooses it, and a job with an open
#     keel-climb/<job>/ PR waits for a person to read it.
#   - The agent never pushes and never merges: its tools let git read, stage,
#     commit and switch, nothing more. It is time-boxed to the budget.
#   - Three jobs, so the agent never holds a credential that can write
#     (ledger#92). `agent` runs it with a token that can only read: checkout
#     keeps no credential, and claude-code-action is given that token, so it
#     never trades for its app's. Its commits leave as a git bundle. `judge`
#     (read-only too, no agent) installs on a fresh checkout of the run's
#     commit (the setup token's only step), then takes them: climb.mjs
#     sandbox first (no workflow, scripts/keel/, .keel/keel.json or install
#     file changed, so the scripts that judge are the default branch's), then
#     the gate and no test dropped (climb.mjs guard), from the run's commit,
#     never the base the night's record names. Its gate runs the agent's
#     code, with no setup token, so it holds no write either. `publish`
#     holds the write token, runs no code of the branch's, checks the sandbox
#     again, and opens one PR on refs/heads/keel-climb/<job>/<date>, never
#     main, never merged here. A night that keeps nothing opens nothing.
#   - A hygiene night that proved no fix files one issue on this repo instead
#     (climb.mjs report --issue): the workflow files it, never the agent.
#   - A lessons or a loop night changes no code: it proposes, for the owner,
#     and its guard refuses anything decided. A loop night pulls Loop first
#     only where keel-loop.yml is not installed; where it is, that workflow's
#     daily pull stands and the night proposes for what it brought, so the
#     two never both pull. Loop unreachable is a notice, not red.
#   - The rotation remembers a night that kept nothing from its record (the
#     keel-climb artifact), never by pushing to main.
#
#   - "agent": "codex" on "climb" (phase 47) runs openai/codex-action in
#     workspace-write with sudo dropped, never danger-full-access or unsafe.
#     Its sandbox keeps .git read-only, so it commits to .keel/agent-git,
#     a git dir a keel step makes before it; after it, a keel step takes only
#     that dir's objects and the branch's ref (never its config or hooks)
#     into a repo keel makes, and the bundle goes on to the judge as Claude's.
#
# SECRET: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) or ANTHROPIC_API_KEY,
# as the claude practice's; OPENAI_API_KEY for a Codex night, billed per
# token to the OpenAI API account. Each climb night spends model tokens, up
# to the configured minutes. No model is pinned here: a pinned model is a fact that ages.
name: keel-climb

on:
  schedule:
    # 10:17 UTC daily, off the night's minute, and after keel-loop.yml's pull
    # (09:43, its job bounded at 30 minutes), so a loop night proposes on
    # today's findings, not yesterday's (ledger#94); a weekly climb's pick
    # says "not tonight" on the other days (cron cannot come from the config).
    - cron: "17 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: keel-climb
  cancel-in-progress: false

# Each job asks for its own; nothing is granted by default.
permissions: {}

jobs:
  # The agent's job: its token reads and nothing more. No id-token: the
  # action is handed this token (github_token), so it never exchanges OIDC
  # for the Claude app's token, which could write.
  agent:
    runs-on: ubuntu-latest
    # The agent's own step is bounded by the budget (5 to 180 minutes); this
    # bounds the whole job, measuring included.
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      job: ${{ steps.pick.outputs.job }}
      branch: ${{ steps.pick.outputs.branch }}
      day: ${{ steps.pick.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Is climb on?
        id: on
        run: |
          node -e '
            const fs = require("fs");
            let c = {};
            try { c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8")); } catch {}
            const on = c.climb !== undefined;
            if (!on) console.log("climb is off: .keel/keel.json has no \"climb\", so this run does nothing.");
            // Which provider runs it (phase 47): read here for the secret gate; the pick validates it.
            const named = c.climb && typeof c.climb === "object" ? c.climb.agent : undefined;
            const agent = named === undefined ? "claude" : /^[a-z]+$/.test(String(named)) ? String(named) : "invalid";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `on=${on}\nagent=${agent}\n`);
          '
      - name: Configured?
        id: configured
        if: steps.on.outputs.on == 'true'
        env:
          AGENT: ${{ steps.on.outputs.agent }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$AGENT" = codex ] && [ -z "$OPENAI" ]; then
            echo "::notice::Skipped: add the OPENAI_API_KEY secret for a climb night by Codex to run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$AGENT" != codex ] && [ -z "$OAUTH" ] && [ -z "$API_KEY" ]; then
            echo "::notice::Skipped: add the CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) secret for a climb night to run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The project's install, as the night's: `setup` when it has one, else
      # npm ci when a lockfile exists; `env` goes to every later step.
      - name: Read the config
        id: config
        if: steps.configured.outputs.enabled == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".keel/keel.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".keel/keel.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".keel/keel.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `KEEL_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.keel/keel.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
          '
      - name: Install
        if: steps.configured.outputs.enabled == 'true'
        # setupToken (a secret's name in .keel/keel.json) becomes GH_TOKEN here
        # and in no other step. Absent or unset, the job's own token. Never echoed.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || github.token }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.keel/keel.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      # The rotation's memory: the last night's record (the keel-climb
      # artifact every night keeps, kept or not), read-only, by name, on the
      # default branch. .keel/climb.json rides on a night's PR, so a night
      # that keeps nothing never reaches main; without this the next night
      # would pick the same job (ledger#92). Nothing is pushed to main for it.
      # None found, or unreadable: a notice, and the rotation reads
      # .keel/climb.json alone.
      - name: Read the last night's record
        if: steps.configured.outputs.enabled == 'true'
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/last-night"
          if ! id=$(gh api "repos/$REPO/actions/artifacts?name=keel-climb&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE\")] | sort_by(.created_at) | last | .id // empty"); then
            echo "::notice::The last night's record could not be listed; the rotation reads .keel/climb.json alone."
            exit 0
          fi
          if [ -z "$id" ]; then
            echo "No earlier night's record: the rotation reads .keel/climb.json alone."
            exit 0
          fi
          if gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/last-night.zip" \
            && unzip -o -q "$RUNNER_TEMP/last-night.zip" -d "$RUNNER_TEMP/last-night"; then
            echo "the last night's record: artifact $id"
          else
            echo "::notice::The last night's record (artifact $id) could not be read; the rotation reads .keel/climb.json alone."
          fi

      # The climb config, validated (a bad one is red, naming the key), and
      # tonight's job: the one tied to the health page's worst measure, else
      # the next in rotation after the last night's; a job with an open PR
      # waits. A dispatch runs even on a weekly climb's off day.
      - name: Pick tonight's job
        id: pick
        if: steps.configured.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/keel/climb.mjs config --json > "$RUNNER_TEMP/climb-config.json"
          set --
          if [ "$EVENT" = workflow_dispatch ]; then set -- "$@" --force; fi
          if [ -f "$RUNNER_TEMP/last-night/night.json" ]; then set -- "$@" --last-night "$RUNNER_TEMP/last-night/night.json"; fi
          node scripts/keel/climb.mjs pick --json "$@" > "$RUNNER_TEMP/pick.json"
          node -e '
            const fs = require("fs");
            const [cfg, pick, out] = process.argv.slice(1);
            const c = JSON.parse(fs.readFileSync(cfg, "utf8"));
            const p = JSON.parse(fs.readFileSync(pick, "utf8"));
            const lines = [`minutes=${c.minutes}`, `job=${p.job ?? ""}`, `branch=${p.branch ?? ""}`, `day=${p.date}`];
            fs.appendFileSync(out, `${lines.join("\n")}\n`);
            console.log(p.job ? `tonight: ${p.job} (${p.why})` : `no climb tonight: ${p.reason}`);
          ' "$RUNNER_TEMP/climb-config.json" "$RUNNER_TEMP/pick.json" "$GITHUB_OUTPUT"

      # Hygiene's number is the test ledger's flaky count: CI's keel-test-runs
      # artifacts on the default branch, read-only, by name, into
      # .keel/test-runs, as the night gathers them. None found is a warning;
      # the baseline then says it cannot tell (exit 2), never a zero.
      - name: Gather the test ledger
        if: steps.pick.outputs.job == 'hygiene'
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .keel/test-runs
          if ! gh api "repos/$REPO/actions/artifacts?name=keel-test-runs&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE\")] | sort_by(.created_at) | reverse | .[:30][] | .id" > "$RUNNER_TEMP/ledger.txt"; then
            echo "::warning::The test ledger's artifacts could not be listed."
            exit 0
          fi
          n=0
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ledger-$id.zip"; then
              unzip -o -q "$RUNNER_TEMP/ledger-$id.zip" -d .keel/test-runs && n=$((n + 1))
            fi
          done < "$RUNNER_TEMP/ledger.txt"
          echo "test ledger: $n artifacts read; $(find .keel/test-runs -name '*.json' | wc -l | tr -d ' ') runs"

      # The baseline opens the night's record (.keel/climb/night.json), on the
      # night's own branch, before the agent changes anything.
      - name: Baseline
        if: steps.pick.outputs.job != ''
        env:
          JOB: ${{ steps.pick.outputs.job }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          git config user.name "keel-climb"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH"
          node scripts/keel/climb.mjs measure "$JOB" --baseline

      # A loop night pulls Loop first where keel-loop.yml is not installed
      # (pull --no-prove: the agent proposes, not a model in the pull);
      # climb.mjs commits it. Where keel-loop.yml is, its daily pull stands
      # and climb.mjs says so: the two never both pull. Loop unreachable (no
      # STITCH_API_KEY, no stitch, a pull that fails) is a notice, never red:
      # the night proposes for the findings already here, and its record
      # says why it did not pull.
      - name: Pull Loop's findings
        if: steps.pick.outputs.job == 'loop'
        env:
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
        run: |
          if [ -n "$STITCH_API_KEY" ] && [ ! -f .github/workflows/keel-loop.yml ]; then
            if ! { npm install -g @google/stitch@0 && stitch enable loop; }; then
              echo "::notice::The stitch CLI could not be installed or switched on; the pull says so below."
            fi
          fi
          node scripts/keel/climb.mjs loop-pull

      # Codex's sandbox keeps .git read-only (phase 47): its commits go to a
      # git dir at .keel/agent-git, made here before it runs, holding the
      # branch as the steps above left it (fetched, so it shares no file with
      # .git's objects), and ignored by both, so no add ever carries it.
      - name: Give Codex its git dir
        if: steps.pick.outputs.job != '' && steps.on.outputs.agent == 'codex'
        env:
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          rm -rf .keel/agent-git
          git init -q --bare .keel/agent-git
          # Codex's TMPDIR, which its sandbox may write: pinned under /tmp,
          # never the runner's temp (GITHUB_ENV and GITHUB_OUTPUT live there).
          mkdir -p /tmp/keel-codex
          git --git-dir=.keel/agent-git fetch -q --no-tags "$PWD/.git" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          git --git-dir=.keel/agent-git symbolic-ref HEAD "refs/heads/$BRANCH"
          git --git-dir=.keel/agent-git config user.name "keel-climb"
          git --git-dir=.keel/agent-git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git --git-dir=.keel/agent-git --work-tree=. reset -q
          mkdir -p .keel/agent-git/info .git/info
          echo "/.keel/agent-git/" >> .keel/agent-git/info/exclude
          echo "/.keel/agent-git/" >> .git/info/exclude
          echo "Codex's git dir: .keel/agent-git, on $(git --git-dir=.keel/agent-git symbolic-ref --short HEAD) at $(git --git-dir=.keel/agent-git rev-parse --short HEAD)"

      # The brief: the protocol, the job, and the pick, as one prompt.
      - name: Brief
        id: brief
        if: steps.pick.outputs.job != ''
        env:
          AGENT: ${{ steps.on.outputs.agent }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          # keel's scripts as the run's commit has them, kept outside the workspace
          # before the agent runs (PR #59): the steps after it run these, never a
          # file the agent edited and did not commit.
          mkdir -p "$RUNNER_TEMP/keel" && git archive "$GITHUB_SHA" scripts/keel .keel/keel.json | tar -x -C "$RUNNER_TEMP/keel"
          {
            cat .agents/climb/PROTOCOL.md
            echo
            cat ".agents/climb/jobs/$JOB.md"
            echo
            echo "## Tonight (climb.mjs pick)"
            echo
            cat "$RUNNER_TEMP/pick.json"
          } > "$RUNNER_TEMP/prompt.md"
          if [ "$AGENT" = codex ]; then
            {
              echo
              echo "## Your git dir (Codex)"
              echo
              echo "Your sandbox keeps \`.git\` read-only, so your git dir is \`.keel/agent-git\`, a clone the workflow made of \`$BRANCH\`. Run every git command as \`git --git-dir=.keel/agent-git --work-tree=. <command>\`, and every climb.mjs command as \`KEEL_AGENT_GIT=.keel/agent-git node scripts/keel/climb.mjs …\`, so its commits, resets and worktrees use it too. Commit on \`$BRANCH\`: only that branch's commits leave this job, as objects (the git dir's config and hooks never do). Never change the git dir's config, hooks or \`info/\`, and never touch \`.git\`."
            } >> "$RUNNER_TEMP/prompt.md"
          fi
          eof="KEEL_EOF_$(date +%s%N)"
          {
            echo "prompt<<$eof"
            cat "$RUNNER_TEMP/prompt.md"
            echo "$eof"
            echo "started=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      # The agent, time-boxed to the budget. Its tools cannot push or merge,
      # it measures only through climb.mjs, and the token it is given reads.
      # A timeout is not red: what it kept before the box closed is judged.
      - name: Climb
        id: climb
        if: steps.pick.outputs.job != '' && steps.on.outputs.agent == 'claude'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.pick.outputs.minutes) }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.brief.outputs.prompt }}
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node scripts/keel/climb.mjs *),Bash(node scripts/loop.mjs list*),Bash(node scripts/loop.mjs propose *),Bash(npm test*),Bash(npm run *),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git add *),Bash(git commit *),Bash(git switch *),Bash(git worktree *)"
      - name: Climb
        id: climb_codex
        if: steps.pick.outputs.job != '' && steps.on.outputs.agent == 'codex'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.pick.outputs.minutes) }}
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ""
          KEEL_AGENT_GIT: .keel/agent-git
          # Its sandbox writes $TMPDIR: pinned away from the runner's temp, whose
          # command files (GITHUB_ENV, GITHUB_OUTPUT) would reach every later step.
          TMPDIR: /tmp/keel-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/prompt.md
          output-file: ${{ runner.temp }}/codex-final-message.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      # An agent that failed before its budget ran out (no secret, a bad
      # model: is_error after one turn) is red, and nothing is judged or
      # pushed: a run that did nothing never reports success (lesson 29). A
      # budget timeout is not red; what it kept is judged below.
      - name: Did the agent run?
        if: steps.pick.outputs.job != ''
        env:
          AGENT: ${{ steps.on.outputs.agent }}
          OUTCOME: ${{ steps.on.outputs.agent == 'codex' && steps.climb_codex.outcome || steps.climb.outcome }}
          EXECUTION: ${{ steps.climb.outputs.execution_file }}
          MINUTES: ${{ steps.pick.outputs.minutes }}
          STARTED: ${{ steps.brief.outputs.started }}
        run: |
          if [ "$AGENT" = codex ]; then
            node "$RUNNER_TEMP/keel/scripts/keel/climb.mjs" agent-ran --agent codex --outcome "$OUTCOME" --file "$RUNNER_TEMP/codex-final-message.md" --minutes "$MINUTES" --started "$STARTED"
          else
            node "$RUNNER_TEMP/keel/scripts/keel/climb.mjs" agent-ran --outcome "$OUTCOME" --file "${EXECUTION:-$RUNNER_TEMP/claude-execution-output.json}" --minutes "$MINUTES" --started "$STARTED"
          fi


      # Never trust the git dir Codex could write (phase 47): its config,
      # hooks, attributes and aliases are the agent's, so no git command here
      # reads it. Only objects leave it: its loose objects and packs (regular
      # files; no symlink, no alternates), copied into a repo keel makes here
      # (its objects' base from .git, which Codex could not write), and the
      # one ref, read as a file. git runs with no system or global config,
      # hooks and fsmonitor off. A head not on top of the run's commit is
      # refused, as the judge would; the night's commits leave as a bundle from keel's repo.
      - name: Take Codex's commits, objects only
        if: always() && steps.pick.outputs.job != '' && steps.on.outputs.agent == 'codex'
        env:
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          src=.keel/agent-git
          dst="$RUNNER_TEMP/agent-objects"
          out="$RUNNER_TEMP/handoff"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          g() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false --git-dir="$dst" "$@"; }
          rm -rf "$dst"
          mkdir -p "$out"
          git init -q --bare "$dst"
          echo "$PWD/.git/objects" > "$dst/objects/info/alternates"
          if [ -d "$src/objects" ] && [ ! -L "$src" ] && [ ! -L "$src/objects" ]; then
            (cd "$src/objects" && find . -type f -print0) | while IFS= read -r -d '' f; do
              case "$f" in
                */*/*/*) continue ;;
                ./[0-9a-f][0-9a-f]/[0-9a-f]*|./pack/pack-*.pack|./pack/pack-*.idx) ;;
                *) continue ;;
              esac
              d=$(dirname "$f")
              if [ -L "$src/objects/$d" ] || [ -L "$src/objects/$f" ] || [ ! -f "$src/objects/$f" ]; then continue; fi
              mkdir -p "$dst/objects/$d"
              cp "$src/objects/$f" "$dst/objects/$f"
            done
          fi
          ref="refs/heads/$BRANCH"
          tip=""
          if [ -f "$src/$ref" ] && [ ! -L "$src/$ref" ]; then
            tip=$(sed -n 1p "$src/$ref")
          elif [ -f "$src/packed-refs" ] && [ ! -L "$src/packed-refs" ]; then
            tip=$(awk -v r="$ref" '$2 == r { print $1; exit }' "$src/packed-refs")
          fi
          if [ -z "$tip" ]; then
            echo "::warning::Codex's git dir has no $ref: nothing of Codex's is handed on."
            exit 0
          fi
          case "$tip" in *[!0-9a-f]*) echo "::error::Codex's $ref is not an object name; nothing is handed on."; exit 1 ;; esac
          if [ "${#tip}" != 40 ] && [ "${#tip}" != 64 ]; then
            echo "::error::Codex's $ref is not an object name; nothing is handed on."
            exit 1
          fi
          if ! g cat-file -e "$tip^{commit}" 2> /dev/null; then
            echo "::error::Codex's $ref names no commit its objects hold; nothing is handed on."
            exit 1
          fi
          if ! g merge-base --is-ancestor "$GITHUB_SHA" "$tip"; then
            echo "::error::Codex's $ref ($tip) is not on top of the run's commit ($GITHUB_SHA); nothing is handed on."
            exit 1
          fi
          g update-ref "$ref" "$tip"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            g bundle create "$out/night.bundle" "$GITHUB_SHA..$ref"
          fi
          echo "Codex's commits: $(g rev-list --count "$GITHUB_SHA..$tip") on $BRANCH, taken as objects"

      # The night's commits leave this job as a git bundle (the run's commit
      # to the branch's head), with the night's record and the test ledger;
      # never its working tree. Kept or not, the record goes on, so the
      # night's history keeps a night whose agent failed.
      - name: Hand the night on
        if: always() && steps.pick.outputs.job != ''
        env:
          BRANCH: ${{ steps.pick.outputs.branch }}
          AGENT: ${{ steps.on.outputs.agent }}
        run: |
          out="$RUNNER_TEMP/handoff"
          mkdir -p "$out/record" "$out/test-runs"
          # Codex's commits are in its git dir, handed on above as objects; .git holds Claude's.
          if [ "$AGENT" != codex ] && git rev-parse -q --verify "refs/heads/$BRANCH" > /dev/null && [ "$(git rev-parse "refs/heads/$BRANCH")" != "$GITHUB_SHA" ]; then
            git bundle create "$out/night.bundle" "$GITHUB_SHA..refs/heads/$BRANCH"
          fi
          if [ -d .keel/climb ]; then cp -R .keel/climb/. "$out/record/"; fi
          if [ -d .keel/test-runs ]; then cp -R .keel/test-runs/. "$out/test-runs/"; fi
      - name: Keep the agent's commits
        if: always() && steps.pick.outputs.job != ''
        uses: actions/upload-artifact@v7
        with:
          name: keel-climb-agent
          path: ${{ runner.temp }}/handoff/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The judge: no agent, and a token that reads. A fresh checkout of the
  # run's commit installs first (the setup token's only step), then takes the
  # agent's commits only after climb.mjs sandbox (this checkout's copy, the
  # default branch's) says they change no workflow, no scripts/keel/, no
  # .keel/keel.json and no install file, so every script below, the config
  # and what was installed are the default branch's, and nothing of the
  # agent's ran where the setup token was. The gate runs the agent's code,
  # with no setup token, which is why this job cannot write either.
  judge:
    needs: agent
    if: needs.agent.outputs.job != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      kept: ${{ steps.judge.outputs.kept }}
      line: ${{ steps.judge.outputs.line }}
      issue: ${{ steps.judge.outputs.issue }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read the config
        id: config
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".keel/keel.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".keel/keel.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".keel/keel.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `KEEL_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.keel/keel.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
          '
      - name: Install
        # As the agent job's: setupToken becomes GH_TOKEN here and in no other
        # step. It runs on the run's own commit, before the agent's commits are
        # taken: no code of theirs (a preinstall script, a changed lockfile)
        # ever runs where the setup token is, and the sandbox below refuses
        # an install file changed, so what is installed is what they run on.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || github.token }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.keel/keel.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      - uses: actions/download-artifact@v8
        with:
          name: keel-climb-agent
          path: ${{ runner.temp }}/handoff
      - name: Take the night's commits
        env:
          BRANCH: ${{ needs.agent.outputs.branch }}
        run: |
          in="$RUNNER_TEMP/handoff"
          head="$GITHUB_SHA"
          if [ -f "$in/night.bundle" ]; then
            git fetch -q "$in/night.bundle" "refs/heads/$BRANCH"
            head=$(git rev-parse FETCH_HEAD)
          fi
          node scripts/keel/climb.mjs sandbox --base "$GITHUB_SHA" --head "$head"
          git config user.name "keel-climb"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH" "$head"
          # The night's record and the ledger, as data: nothing else of the agent's tree.
          mkdir -p .keel/climb .keel/test-runs
          for f in night.json .gitignore; do
            if [ -f "$in/record/$f" ]; then cp "$in/record/$f" .keel/climb/; fi
          done
          if [ -d "$in/test-runs" ]; then cp -R "$in/test-runs/." .keel/test-runs/; fi

      # Judged by the script, not the agent: drop anything no compare kept,
      # run the gate and check no test was dropped (red if either fails), the
      # night's base against its end, then the PR body and the night's line.
      - name: Judge the night
        id: judge
        env:
          JOB: ${{ needs.agent.outputs.job }}
          DAY: ${{ needs.agent.outputs.day }}
        run: |
          # The base is the run's commit, never the record's (the agent wrote
          # the record): a night naming another base is refused.
          node scripts/keel/climb.mjs settle --base "$GITHUB_SHA"
          node scripts/keel/climb.mjs guard --base "$GITHUB_SHA"
          node scripts/keel/climb.mjs compare --final --base "$GITHUB_SHA"
          node scripts/keel/climb.mjs report --state --body "$RUNNER_TEMP/body.md" --issue "$RUNNER_TEMP/issue.md" --base "$GITHUB_SHA" --json > "$RUNNER_TEMP/report.json"
          node -e '
            const fs = require("fs");
            const [file, out, summary, title] = process.argv.slice(1);
            const r = JSON.parse(fs.readFileSync(file, "utf8"));
            // A hygiene night that proved nothing: the issue to file, its title in a file (never an output to escape).
            if (r.issue) fs.writeFileSync(title, r.issue.title);
            fs.appendFileSync(out, `kept=${r.kept}\nline=${r.line}\nissue=${r.issue ? "yes" : ""}\n`);
            fs.appendFileSync(summary, `${r.line}\n`);
            console.log(r.line);
          ' "$RUNNER_TEMP/report.json" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/issue-title.txt"
          # The rotation's state rides on the PR, as one more commit, when there
          # is one; a night that keeps nothing is remembered by its record (the
          # keel-climb artifact), which the next night's pick reads.
          kept=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).kept ?? 0)' "$RUNNER_TEMP/report.json")
          if [ "$kept" != 0 ] && [ -n "$(git status --porcelain -- .keel/climb.json)" ]; then
            git add .keel/climb.json
            git commit -q -m "keel climb: $JOB $DAY, rotation state"
          fi

      # The judged night goes on as the agent's did: a bundle, the PR body,
      # the issue, the record. Kept or not, the record goes on.
      - name: Hand the judged night on
        if: always()
        env:
          BRANCH: ${{ needs.agent.outputs.branch }}
        run: |
          out="$RUNNER_TEMP/judged"
          mkdir -p "$out/record"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] && git rev-parse -q --verify "refs/heads/$BRANCH" > /dev/null; then
            git bundle create "$out/night.bundle" "$GITHUB_SHA..refs/heads/$BRANCH"
          fi
          for f in body.md issue.md issue-title.txt; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" "$out/"; fi
          done
          if [ -d .keel/climb ]; then cp -R .keel/climb/. "$out/record/"; fi
      - name: Keep the judged night
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keel-climb-judged
          path: ${{ runner.temp }}/judged/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The only job that can write: no agent, and nothing of the branch's runs
  # here. It checks the sandbox again (git only), pushes the judged commits
  # to the night's own branch, opens one PR, files hygiene's issue, and keeps
  # the night's record, whatever happened before it.
  publish:
    needs: [agent, judge]
    if: always() && needs.agent.outputs.job != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: needs.judge.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: keel-climb-judged
          path: ${{ runner.temp }}/night
      # A night the judge never finished keeps the agent's record.
      - if: needs.judge.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: keel-climb-agent
          path: ${{ runner.temp }}/night

      # One PR, on this workflow's own prefix; a person merges it. A night
      # that kept nothing pushes nothing.
      - name: Open the climb's pull request
        if: needs.judge.result == 'success'
        env:
          KEPT: ${{ needs.judge.outputs.kept }}
          LINE: ${{ needs.judge.outputs.line }}
          JOB: ${{ needs.agent.outputs.job }}
          DAY: ${{ needs.agent.outputs.day }}
          BRANCH: ${{ needs.agent.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$KEPT" = 0 ] || [ -z "$KEPT" ]; then
            echo "::notice::No PR: $LINE"
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/night/night.bundle" ]; then
            echo "::error::The judge kept $KEPT, but handed on no commits; nothing is pushed."
            exit 1
          fi
          # The judged commits, fetched as objects: the working tree stays
          # this run's commit, and the sandbox is this checkout's script.
          git fetch -q "$RUNNER_TEMP/night/night.bundle" "refs/heads/$BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          node scripts/keel/climb.mjs sandbox --base "$GITHUB_SHA" --head "$head"
          # The branch is this workflow's alone; a re-run the same day replaces
          # its own night, so force is safe here and nowhere else.
          git push --force origin "$head:refs/heads/keel-climb/$JOB/$DAY"
          if ! gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' | grep -q .; then
            code=0
            out=$(gh pr create --base "$BASE" --head "$BRANCH" --title "keel climb: $JOB, $DAY" --body-file "$RUNNER_TEMP/night/body.md" 2>&1) || code=$?
            echo "$out"
            if [ "$code" != 0 ]; then
              if printf '%s' "$out" | grep -qi 'not permitted to create or approve pull requests'; then
                echo "::notice::$BRANCH is pushed, but no PR was opened: allow it in Settings → Actions → General → Workflow permissions → \"Allow GitHub Actions to create and approve pull requests\"."
              else
                exit "$code"
              fi
            fi
          fi
          # The PR's number goes in the night's record, for the night's health line.
          num=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$num" ]; then
            node -e '
              const fs = require("fs");
              const [file, n] = process.argv.slice(1);
              const night = JSON.parse(fs.readFileSync(file, "utf8"));
              night.pr = Number(n);
              fs.writeFileSync(file, `${JSON.stringify(night, null, 2)}\n`);
            ' "$RUNNER_TEMP/night/record/night.json" "$num"
          fi

      # A hygiene night that proved no fix: one issue on this repo, with the
      # ledger's evidence, unless one with the same title is already open.
      - name: File the flaky test
        if: needs.agent.outputs.job == 'hygiene' && needs.judge.outputs.issue == 'yes'
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(cat "$RUNNER_TEMP/night/issue-title.txt")
          if gh issue list --repo "$REPO" --state open --json title --limit 200 --jq '.[].title' | grep -qxF -- "$title"; then
            echo "::notice::Already open: $title"
            exit 0
          fi
          gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/night/issue.md"

      # The night's record (every attempt, its numbers, the line), kept 30
      # days, kept or not: the one keel-climb artifact the night reads.
      - name: Keep the climb's record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keel-climb
          path: ${{ runner.temp }}/night/record/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
